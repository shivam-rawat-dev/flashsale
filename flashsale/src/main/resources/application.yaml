spring:
  application:
    name: flashsale

  # PostgreSQL Data Source
  datasource:
    url: ${RDS_DB_URL:jdbc:postgresql://localhost:5432/flashsale_db}
    username: ${RDS_DB_USERNAME:postgres}
    password: ${RDS_DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Spring Boot Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
      timeout: 3000ms

  # RabbitMQ Configuration (Resilient startup retries)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: true
        missing-queues-fatal: false
        retry:
          enabled: true
          initial-interval: 3000ms
          max-interval: 10000ms
          max-attempts: 10
    template:
      retry:
        enabled: true
        initial-interval: 2000ms
        max-attempts: 5

  # Apache Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: flashsale-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: false
    admin:
      fail-fast: false

# OpenAPI / Swagger UI Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Actuator Health Config (Exclude optional sidecars from failing container health check)
management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  health:
    rabbit:
      enabled: false
    kafka:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:dummy-access-key}
      secret-key: ${AWS_SECRET_ACCESS_KEY:dummy-secret-key}
    region:
      static: ${AWS_REGION:ap-south-1}
