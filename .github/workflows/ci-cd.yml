name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Spin up Integration Containers
        run: docker-compose up -d postgres redis rabbitmq kafka

      - name: Build Application & Run Unit/Integration Tests
        run: ./mvnw clean test

      - name: Build Docker Image
        run: docker build -t flashsale-engine:latest .

      - name: Shut down Containers
        if: always()
        run: docker-compose down