networks:
  flashsale-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  elasticsearch_data:

services:
  # -----------------------------------------------------------------
  # 1. Primary Database (PostgreSQL)
  # -----------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: flashsale-postgres
    environment:
      POSTGRES_DB: flashsale_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flashsale-network

  # -----------------------------------------------------------------
  # 2. In-Memory Atomic Cache (Redis)
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispassword
    volumes:
      - redis_data:/data
    networks:
      - flashsale-network

  # -----------------------------------------------------------------
  # 3. Delay Queue Engine (RabbitMQ with Delayed Message Plugin)
  # -----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: flashsale-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP Protocol Port
      - "15672:15672"  # Management Web UI Port
    networks:
      - flashsale-network

  # -----------------------------------------------------------------
  # 4. Asynchronous Event Stream (Apache Kafka - KRaft Mode)
  # -----------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - flashsale-network

  # -----------------------------------------------------------------
  # 5. Metrics Aggregator & Visualization (Prometheus + Grafana)
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: flashsale-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - flashsale-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: flashsale-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - flashsale-network

  # -----------------------------------------------------------------
  # 6. Centralized Logging (Elasticsearch + Kibana)
  # -----------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
    container_name: flashsale-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - flashsale-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.2
    container_name: flashsale-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - flashsale-network


  app:
    build: .
    container_name: flashsale-backend
    ports:
      - "8080:8080"
    environment:
      - RDS_DB_URL=jdbc:localhost:5432/postgres
      - RDS_DB_USERNAME=postgres
      - RDS_DB_PASSWORD=your_password
      - REDIS_HOST=flashsale-redis
      - REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=your_password
      - RABBITMQ_HOST=flashsale-rabbitmq
      - RABBITMQ_PORT=5672
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AWS_ACCESS_KEY_ID=your_secret_key
      - AWS_SECRET_ACCESS_KEY=your_access_key
      - AWS_REGION=your_region
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - kafka
    networks:
      - flashsale-network

