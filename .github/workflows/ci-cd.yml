name: FlashSale CI/CD Pipeline - AWS ECS Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Prevent concurrent deployments from conflicting
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || vars.aws_region || secrets.AWS_REGION || secrets.aws_region || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || vars.ecr_repository || secrets.ECR_REPOSITORY || 'flashsale-backend' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || vars.ecs_cluster || secrets.ECS_CLUSTER || 'flashsale-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || vars.ecs_service || secrets.ECS_SERVICE || 'flashsale-service' }}
  ECS_TASK_DEFINITION: flashsale/task-definition.json
  CONTAINER_NAME: flashsale-backend

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for actions/checkout

jobs:
  # =========================================================================
  # 1. Continuous Integration: Lint, Unit & Integration Tests, Artifact Build
  # =========================================================================
  ci-build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashsale

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: flashsale/pom.xml

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('flashsale/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit & Integration Tests
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

      - name: Package Application JAR
        run: |
          ./mvnw package -DskipTests -B

      - name: Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: flashsale-app-jar
          path: flashsale/target/*.jar
          retention-days: 7

  # =========================================================================
  # 2. Continuous Delivery: Build Container, Push to AWS ECR, Deploy to ECS
  # =========================================================================
  cd-deploy-to-aws:
    name: Build Image & Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [ci-build-and-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GHA-FlashSale-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./flashsale
          file: ./flashsale/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render New Image URI in Amazon ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 AWS ECS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Image**: \`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Cluster**: \`${{ env.ECS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Service**: \`${{ env.ECS_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Deployed Successfully' || '❌ Deployment Failed' }}" >> $GITHUB_STEP_SUMMARY
