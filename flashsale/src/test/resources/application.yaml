spring:
  application:
    name: flashsale-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

cloud:
  aws:
    credentials:
      access-key: test-key
      secret-key: test-secret
    region:
      static: ap-south-1
    s3:
      region: ap-south-1
